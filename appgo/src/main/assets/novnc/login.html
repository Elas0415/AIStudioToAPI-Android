<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!--
  Login window for the noVNC view.

  The app keeps this WebView at exactly the remote framebuffer's size (it sizes
  Xvfb to "screen - app bar" and this container is that area), so `scaleViewport`
  below resolves to a 1:1 mapping: the browser fills the window with no black
  bars and Chromium rasterises it at native resolution. Zooming is done by the
  native PinchZoomLayout, which resizes the WebView, so this page never scales
  itself and stays touch-faithful.

  The page draws no chrome of its own: status, "type text", "reconnect" and "fit"
  all live in the app's own app bar (see MainActivity / login_menu.xml). All this
  page adds is a boot notice that goes away as soon as the remote desktop is no
  longer a blank screen.

  What this page must NOT do is scale the picture on its own. If the remote
  desktop ever looks "clipped", the missing pixels are not in the canvas: the
  canvas is the whole framebuffer, and the framebuffer is what x11vnc captured.
  A browser window that is drawn outside the X screen is simply not in that
  image (tinywm in the rootfs is what keeps Camoufox inside it). So the page
  only ever re-runs noVNC's own fit (`scaleViewport`) when the view's size
  changes, and reports the numbers to the app (menu 「适配信息」) instead of
  hiding a geometry problem behind a transform.
-->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>登录窗口</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    box-sizing: border-box; background: #000; overflow: hidden;
    overscroll-behavior: none;
  }
  /* The view noVNC fits into: exactly the WebView, never scrollable, so the
     canvas can never be pushed partly off-screen by the document itself. */
  #screen {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    overflow: hidden;
  }
  /* Do not style the canvas: noVNC sets its size inline from the fit scale,
     and overriding it stretches the remote desktop out of shape. */
  #boot {
    position: absolute; left: 0; right: 0; top: 50%; z-index: 5;
    transform: translateY(-50%);
    text-align: center; pointer-events: none;
    font: 13px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #C9D1D9;
  }
  #boot .ring {
    width: 26px; height: 26px; margin: 0 auto 10px;
    border: 2px solid rgba(201,209,217,0.25); border-top-color: #79C0FF;
    border-radius: 50%; animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #boot.gone { display: none; }
  /*
    The remote desktop is a canvas, so Android would never show the soft
    keyboard: a canvas is not editable. This off-screen textarea is the
    editable element the IME types into; the page diffs it and forwards the
    characters. pointer-events:none keeps every touch going to noVNC, so
    clicking/zooming the remote browser is unaffected.
  */
  #ime {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    z-index: 4; margin: 0; padding: 0; border: 0; resize: none;
    background: transparent; color: transparent; caret-color: transparent;
    opacity: 0; pointer-events: none;
  }
  /*
    Local pointer indicator. Camoufox's fingerprint sets showcursor=false, so
    the remote X cursor can be invisible; this ring follows the position the
    joystick/buttons are driving, without touching the remote framebuffer.
  */
  #local-cursor {
    position: fixed; left: 0; top: 0; width: 18px; height: 18px;
    margin: -9px 0 0 -9px; box-sizing: border-box;
    border: 2px solid rgba(255,255,255,0.95); border-radius: 50%;
    box-shadow: 0 0 6px rgba(0,0,0,0.9);
    pointer-events: none; z-index: 20; display: none;
  }
  #local-cursor::after {
    content: ""; position: absolute; left: 5px; top: 5px;
    width: 4px; height: 4px; border-radius: 50%; background: #fff;
  }
</style>
</head>
<body>
<div id="screen"></div>
<div id="local-cursor"></div>
<textarea id="ime" aria-hidden="true" autocomplete="off" autocorrect="off"
          autocapitalize="off" spellcheck="false" tabindex="-1"></textarea>
<div id="boot"><div class="ring"></div><div id="bootText">正在启动登录浏览器…</div></div>

<script type="module">
import RFB from './core/rfb.js';

const screenEl = document.getElementById('screen');
const bootEl = document.getElementById('boot');
const bootTextEl = document.getElementById('bootText');
const imeEl = document.getElementById('ime');
const localCursorEl = document.getElementById('local-cursor');

let rfb = null;
let bootTimer = null;
let bootDeadline = 0;
let sizeTimer = null;

/* ------------------------------------------------------------------ *
 * Bridge to the app (status line in the login window's app bar).
 * ------------------------------------------------------------------ */
function bridge(state, w, h) {
  try {
    const a = window.AndroidVnc;
    if (!a) return;
    if (state && a.onState) a.onState(state);
    if (w && h && a.onRemoteSize) a.onRemoteSize(w, h);
  } catch (e) { /* page still usable without the app */ }
}

/* ------------------------------------------------------------------ *
 * Remote framebuffer size, reported to the app.
 *
 * noVNC keeps the canvas at the framebuffer's resolution and only scales its
 * CSS size, so the canvas size is the remote desktop size. This version of
 * noVNC has no "desktopsize" event, hence the small poll.
 * ------------------------------------------------------------------ */
let lastRemoteW = 0;
let lastRemoteH = 0;

function remoteSize() {
  const canvas = screenEl.querySelector('canvas');
  if (canvas && canvas.width > 0 && canvas.height > 0) {
    return [canvas.width, canvas.height];
  }
  if (rfb && rfb._fbWidth > 0 && rfb._fbHeight > 0) {
    return [rfb._fbWidth, rfb._fbHeight];
  }
  return null;
}

function reportRemoteSize() {
  const size = remoteSize();
  if (!size) return;
  if (size[0] !== lastRemoteW || size[1] !== lastRemoteH) {
    lastRemoteW = size[0];
    lastRemoteH = size[1];
    bridge(null, lastRemoteW, lastRemoteH);
    reportMetrics();
  }
}

/* ------------------------------------------------------------------ *
 * View fit (menu 「适配信息」 reports these numbers to the app).
 *
 * noVNC keeps the canvas at the framebuffer's resolution and fits it into
 * #screen with `scaleViewport`. Since the app sizes this view to the remote
 * desktop, that fit resolves to 1:1 (scale 1.0, canvas == view); the fit is
 * re-run whenever the view's size changes (soft keyboard, rotation, overlay
 * re-shown) by re-asserting `scaleViewport`, which is idempotent and never
 * stacks a second scale on top of noVNC's own.
 * ------------------------------------------------------------------ */
let refitQueued = false;

function metrics() {
  const canvas = screenEl.querySelector('canvas');
  const fb = remoteSize();
  const viewW = screenEl.clientWidth;
  const viewH = screenEl.clientHeight;
  const rect = canvas ? canvas.getBoundingClientRect() : null;
  const canvasW = rect ? Math.round(rect.width) : 0;
  const canvasH = rect ? Math.round(rect.height) : 0;
  return {
    fb: fb ? fb[0] + 'x' + fb[1] : '-',
    view: viewW + 'x' + viewH,
    canvas: canvasW + 'x' + canvasH,
    scale: fb && fb[0] ? Number((canvasW / fb[0]).toFixed(3)) : 0,
    overflow: (canvasW > viewW + 1 || canvasH > viewH + 1) ? 'yes' : 'no',
  };
}

function reportMetrics() {
  try {
    const a = window.AndroidVnc;
    if (a && a.onMetrics) a.onMetrics(JSON.stringify(metrics()));
  } catch (e) { /* page still usable without the app */ }
}

function refit() {
  refitQueued = false;
  if (rfb) {
    try { rfb.scaleViewport = true; } catch (e) { /* ignore */ }
    enforceFit();
  }
  reportRemoteSize();
  reportMetrics();
  updateLocalCursor();
}

/*
 * Last line of defence: the canvas must never be bigger than the view it is
 * shown in. If noVNC's own fit left it overflowing (the view changed size
 * between two layouts, e.g. right after the app switched to landscape), force
 * one more fit and, if that still does not help, set the scale by hand.
 */
function enforceFit() {
  const canvas = screenEl.querySelector('canvas');
  const fb = remoteSize();
  if (!canvas || !fb || !rfb) return;
  const vw = screenEl.clientWidth;
  const vh = screenEl.clientHeight;
  if (!vw || !vh) return;
  const fits = () => {
    const r = canvas.getBoundingClientRect();
    return r.width <= vw + 1 && r.height <= vh + 1;
  };
  if (fits()) return;
  try {
    rfb.scaleViewport = false;
    rfb.scaleViewport = true;
  } catch (e) { /* ignore */ }
  if (fits()) return;
  try {
    const s = Math.min(vw / fb[0], vh / fb[1]);
    if (s > 0 && isFinite(s)) rfb._display.scale = s;
  } catch (e) { /* ignore */ }
}

function scheduleRefit() {
  if (refitQueued) return;
  refitQueued = true;
  requestAnimationFrame(refit);
}

window.addEventListener('resize', scheduleRefit);
window.addEventListener('orientationchange', scheduleRefit);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', scheduleRefit);
}
document.addEventListener('visibilitychange', () => {
  // The overlay was hidden and is visible again: the view has a size again.
  if (!document.hidden) scheduleRefit();
});
if (typeof ResizeObserver === 'function') {
  new ResizeObserver(scheduleRefit).observe(screenEl);
}

/* ------------------------------------------------------------------ *
 * Boot notice: shown while the remote desktop is still blank (Xvfb's root
 * window before Camoufox maps), removed the moment pixels appear.
 * ------------------------------------------------------------------ */
const probe = document.createElement('canvas');
probe.width = 8;
probe.height = 8;
const probeCtx = probe.getContext('2d');

function desktopHasContent() {
  const canvas = screenEl.querySelector('canvas');
  if (!canvas || !canvas.width || !canvas.height) return false;
  try {
    probeCtx.clearRect(0, 0, 8, 8);
    probeCtx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, 8, 8);
    const d = probeCtx.getImageData(0, 0, 8, 8).data;
    for (let i = 0; i < d.length; i += 4) {
      if (d[i] > 12 || d[i + 1] > 12 || d[i + 2] > 12) return true;
    }
  } catch (e) {
    // Unreadable canvas (e.g. a WebGL renderer without preserveDrawingBuffer):
    // never let the notice get stuck because of that.
    return true;
  }
  return false;
}

function hideBoot(ready) {
  if (bootTimer) {
    clearInterval(bootTimer);
    bootTimer = null;
  }
  bootEl.classList.add('gone');
  if (ready) bridge('ready');
}

function watchBoot() {
  bootDeadline = Date.now() + 90000;
  if (bootTimer) clearInterval(bootTimer);
  bootTimer = setInterval(() => {
    reportRemoteSize();
    if (desktopHasContent()) {
      hideBoot(true);
    } else if (Date.now() > bootDeadline) {
      // Give up quietly rather than covering the desktop forever.
      hideBoot(false);
    }
  }, 400);
}

function showBoot(text) {
  bootTextEl.textContent = text;
  bootEl.classList.remove('gone');
  watchBoot();
}

/* ------------------------------------------------------------------ *
 * Connection
 * ------------------------------------------------------------------ */
function wsUrl() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  return proto + '://' + location.host + '/websockify';
}

function connect() {
  bridge('connecting');
  showBoot('正在启动登录浏览器…');
  try {
    rfb = new RFB(screenEl, wsUrl(), { credentials: { password: '' } });
    // Fit the whole desktop into this view. The app sizes this view to the
    // remote screen, so "fit" means "fill, 1:1".
    rfb.scaleViewport = true;
    rfb.clipViewport = false;
    rfb.resizeSession = false;
    rfb.viewOnly = false;

    rfb.addEventListener('connect', () => {
      bridge('connected');
      bootTextEl.textContent = '正在启动登录浏览器…';
      rfb.focus();
      reportRemoteSize();
      // The framebuffer size only exists now, so this first fit is the real one.
      scheduleRefit();
      // The view may still be settling (rotation / keyboard): fit once more
      // after the layout has stopped moving.
      setTimeout(scheduleRefit, 300);
      // The framebuffer is readable now; the poll above hides the notice as
      // soon as Camoufox paints its window.
      watchBoot();
      // Keep the app's aspect ratio honest if the desktop is resized later.
      if (!sizeTimer) sizeTimer = setInterval(reportRemoteSize, 1500);
    });
    rfb.addEventListener('disconnect', (e) => {
      const clean = e.detail && e.detail.clean;
      bridge('disconnected');
      showBoot(clean ? '登录窗口已断开' : '连接断开…');
    });
  } catch (err) {
    bridge('disconnected');
    bootTextEl.textContent = '连接失败：' + err.message;
  }
}

/* ------------------------------------------------------------------ *
 * Text input (used by the app bar's 「输入文本…」)
 * ------------------------------------------------------------------ */
const XK_SHIFT = 0xFFE1;
const XK_CTRL = 0xFFE3;
const XK_RETURN = 0xFF0D;
const SHIFTED = {
  '!': '1', '@': '2', '#': '3', '$': '4', '%': '5', '^': '6', '&': '7',
  '*': '8', '(': '9', ')': '0', '_': '-', '+': '=', '{': '[', '}': ']',
  '|': '\\', ':': ';', '"': "'", '<': ',', '>': '.', '?': '/', '~': '`',
};

function tapKey(keysym) {
  rfb.sendKey(keysym, null, true);
  rfb.sendKey(keysym, null, false);
}

function typeChar(ch) {
  // Send the character's own keysym and let x11vnc pick the keycode *and* the
  // shift level. Driving Shift ourselves looked equivalent but did not work:
  // the server maps the next keysym without the modifier we pressed, so '@'
  // arrived as '2' and ':' as ';'.
  tapKey(ch.charCodeAt(0));
}

// Chars go out one at a time: Camoufox drops bursts sent in a single tick.
let sendQueue = Promise.resolve();

function sendText(text) {
  for (const ch of Array.from(text)) {
    sendQueue = sendQueue.then(() => new Promise((res) => {
      if (ch === '\n') tapKey(XK_RETURN);
      else typeChar(ch);
      setTimeout(res, 18);
    }));
  }
  return sendQueue;
}

/** Ctrl+A in the remote window: select the focused field's content. */
function selectAllRemote() {
  rfb.sendKey(XK_CTRL, 'ControlLeft', true);
  tapKey(0x61); // 'a'
  rfb.sendKey(XK_CTRL, 'ControlLeft', false);
}

/* ------------------------------------------------------------------ *
 * Virtual mouse: the app's left joystick sends relative movement, the right
 * buttons send RFB left/right button masks. Both only inject pointer events;
 * normal page taps still go through noVNC's own handlers.
 * ------------------------------------------------------------------ */
let mouseX = null;
let mouseY = null;
let mouseFb = '';
let mouseMask = 0;

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function pointerSize() {
  const fb = remoteSize();
  if (!fb || !rfb) return null;
  const key = fb[0] + 'x' + fb[1];
  if (mouseFb !== key || mouseX === null || mouseY === null) {
    mouseFb = key;
    mouseX = fb[0] / 2;
    mouseY = fb[1] / 2;
  }
  return fb;
}

function sendMousePointer() {
  if (!rfb || mouseX === null || mouseY === null) return false;
  updateLocalCursor();
  try {
    if (rfb._rfbConnectionState !== 'connected' || !rfb._sock) return false;
    // Framebuffer coordinates: bypass the view->framebuffer mapping used by
    // noVNC's own mouse handler, because our pointer is already remote-space.
    RFB.messages.pointerEvent(rfb._sock, Math.round(mouseX), Math.round(mouseY), mouseMask);
    return true;
  } catch (e) {
    return false;
  }
}

function updateLocalCursor() {
  if (!localCursorEl) return;
  const canvas = screenEl.querySelector('canvas');
  const fb = remoteSize();
  if (!canvas || !fb || mouseX === null || mouseY === null) {
    localCursorEl.style.display = 'none';
    return;
  }
  const rect = canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) {
    localCursorEl.style.display = 'none';
    return;
  }
  const x = rect.left + mouseX / fb[0] * rect.width;
  const y = rect.top + mouseY / fb[1] * rect.height;
  localCursorEl.style.display = 'block';
  localCursorEl.style.transform = 'translate(' + x + 'px,' + y + 'px)';
}

window.__a2apiMove = function (dx, dy) {
  const fb = pointerSize();
  if (!fb) return false;
  const step = Math.max(fb[0], fb[1]) * 0.010;
  mouseX = clamp(mouseX + dx * step, 0, fb[0] - 1);
  mouseY = clamp(mouseY + dy * step, 0, fb[1] - 1);
  return sendMousePointer();
};

window.__a2apiButton = function (button, down) {
  const fb = pointerSize();
  if (!fb) return false;
  const bit = button === 2 ? 4 : 1; // RFB: 1=left, 4=right
  if (down) mouseMask |= bit; else mouseMask &= ~bit;
  return sendMousePointer();
};

window.__a2apiRelease = function () {
  mouseMask = 0;
  sendMousePointer();
};

window.__a2apiMouseState = function () {
  return {
    state: rfb ? rfb._rfbConnectionState : null,
    socket: !!(rfb && rfb._sock),
    fb: remoteSize(),
    x: mouseX,
    y: mouseY,
    mask: mouseMask,
  };
};

function trackPointer(clientX, clientY) {
  const canvas = screenEl.querySelector('canvas');
  const fb = remoteSize();
  if (!canvas || !fb) return;
  const rect = canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  mouseX = clamp((clientX - rect.left) * fb[0] / rect.width, 0, fb[0] - 1);
  mouseY = clamp((clientY - rect.top) * fb[1] / rect.height, 0, fb[1] - 1);
  mouseFb = fb[0] + 'x' + fb[1];
  updateLocalCursor();
}

['pointerdown', 'pointermove', 'mousedown', 'mousemove', 'touchstart', 'touchmove']
  .forEach(function (type) {
    screenEl.addEventListener(type, function (e) {
      if (e.touches && e.touches.length) {
        trackPointer(e.touches[0].clientX, e.touches[0].clientY);
      } else {
        trackPointer(e.clientX, e.clientY);
      }
    }, { capture: true, passive: true });
  });

/*
 * Entry point for the app's 「键盘」 bar. Types the text into whatever field the
 * remote window has focused and then presses Return, so one Enter on the phone
 * both fills and submits the field. An empty text still sends Return.
 *
 * With {@code replace} the field is select-all'd first, so re-sending an edited
 * text overwrites what is already there instead of appending to it.
 */
/** 「重连」: put the remote browser back on the sign-in page. */
window.__a2apiNav = function (url) {
  if (!rfb) return false;
  // Ctrl+L focuses and selects the address bar, so the URL replaces it.
  rfb.sendKey(XK_CTRL, 'ControlLeft', true);
  tapKey(0x6C); // 'l'
  rfb.sendKey(XK_CTRL, 'ControlLeft', false);
  setTimeout(() => {
    sendText(String(url)).then(() => setTimeout(() => tapKey(XK_RETURN), 120));
  }, 250);
  return true;
};

window.__a2apiSend = function (text, replace) {
  if (!rfb) return false;
  const body = text == null ? '' : String(text);
  const submit = () => {
    const typed = body ? sendText(body) : Promise.resolve();
    typed.then(() => setTimeout(() => tapKey(XK_RETURN), 40));
  };
  if (replace) {
    selectAllRemote();
    // Let the selection land before the first character arrives.
    setTimeout(submit, 80);
  } else {
    submit();
  }
  return true;
};

/* ------------------------------------------------------------------ *
 * Soft keyboard (IME) passthrough.
 *
 * A tap on the remote desktop focuses an invisible textarea, which is what
 * makes Android show its keyboard; typed text is diffed and sent as key
 * events (Chinese/emoji included: BMP chars map to their Unicode keysym).
 * ------------------------------------------------------------------ */
const XK_BACKSPACE = 0xFF08;
const XK_TAB = 0xFF09;
const XK_DELETE = 0xFFFF;

let imeComposing = false;

function focusIme() {
  try {
    imeEl.focus({ preventScroll: true });
  } catch (e) {
    try { imeEl.focus(); } catch (e2) { /* no IME available */ }
  }
}

function flushIme() {
  const text = imeEl.value;
  if (!text) return;
  imeEl.value = '';
  if (rfb) sendText(text);
}

imeEl.addEventListener('compositionstart', () => { imeComposing = true; });
imeEl.addEventListener('compositionend', () => { imeComposing = false; flushIme(); });
imeEl.addEventListener('input', () => { if (!imeComposing) flushIme(); });
imeEl.addEventListener('keydown', (e) => {
  if (!rfb) return;
  if (e.key === 'Backspace' && imeEl.value === '') {
    tapKey(XK_BACKSPACE);
    e.preventDefault();
  } else if (e.key === 'Delete' && imeEl.value === '') {
    tapKey(XK_DELETE);
    e.preventDefault();
  } else if (e.key === 'Tab') {
    tapKey(XK_TAB);
    e.preventDefault();
  } else if (e.key === 'Enter') {
    // Send Return instead of letting the textarea buffer a newline, so the
    // remote page never sees a double Return.
    tapKey(XK_RETURN);
    e.preventDefault();
  }
});

/* ------------------------------------------------------------------ *
 * Cursor shape: is the remote pointer over a text field?
 *
 * noVNC draws the server's cursor bitmap into its own <canvas> appended to
 * <body> (the touch fallback), so the shape is readable from the page. An
 * I-beam is narrow with wide serifs on its first and last row; an arrow grows
 * from a one-pixel tip instead. That is what lets a tap raise the keyboard
 * only on inputs, instead of on every click.
 * ------------------------------------------------------------------ */
function cursorCanvas() {
  const kids = document.body.children;
  for (let i = 0; i < kids.length; i++) {
    if (kids[i].tagName === 'CANVAS') return kids[i];
  }
  return null;
}

function textCursorVisible() {
  const c = cursorCanvas();
  if (!c || !c.width || !c.height) return false;
  const w = c.width, h = c.height;
  let d;
  try {
    d = c.getContext('2d').getImageData(0, 0, w, h).data;
  } catch (e) {
    return false;
  }
  const rows = [];
  let minY = -1, maxY = -1, minX = w, maxX = -1;
  for (let y = 0; y < h; y++) {
    let first = -1, last = -1;
    for (let x = 0; x < w; x++) {
      if (d[(y * w + x) * 4 + 3] > 40) {
        if (first < 0) first = x;
        last = x;
      }
    }
    rows.push([first, last]);
    if (first >= 0) {
      if (minY < 0) minY = y;
      maxY = y;
      if (first < minX) minX = first;
      if (last > maxX) maxX = last;
    }
  }
  if (maxX < 0) return false;
  const bw = maxX - minX + 1;
  const bh = maxY - minY + 1;
  if (bh < 10 || bw > 14) return false;
  // A plain bar (no serifs) is still a text caret.
  if (bw <= 4) return true;
  const topW = rows[minY][1] - rows[minY][0] + 1;
  const botW = rows[maxY][1] - rows[maxY][0] + 1;
  const midW = rows[minY + Math.floor(bh / 2)][1] - rows[minY + Math.floor(bh / 2)][0] + 1;
  return topW >= 3 && botW >= 3 && midW < topW;
}

// Tap (not pinch, not drag) = a click. If the click lands on a text field the
// server turns the pointer into an I-beam; only then is the keyboard wanted.
let tapStart = 0;
let tapX = 0;
let tapY = 0;
let multiTouch = false;
let imeProbe = 0;

/*
 * Reads the text of the remote field that was just tapped.
 *
 * The app's input bar is a native EditText and cannot see the remote DOM, so
 * without this it would either start empty (nothing to edit) or, worse, keep
 * the previous field's text when the user moves on to the next field. Select
 * all + copy in the remote browser puts the field's text on the X clipboard,
 * which x11vnc mirrors to noVNC as a "clipboard" event. Resolves with "" when
 * nothing arrives (empty field, password field, or no clipboard sync).
 */
function readFocusedField(cb) {
  let done = false;
  const finish = (text) => {
    if (done) return;
    done = true;
    rfb.removeEventListener('clipboard', onClipboard);
    cb(text);
  };
  const onClipboard = (e) => finish((e.detail && e.detail.text) || '');
  rfb.addEventListener('clipboard', onClipboard);
  rfb.sendKey(XK_CTRL, 'ControlLeft', true);
  tapKey(0x61); // 'a' — select the field's content
  tapKey(0x63); // 'c' — copy it to the X clipboard
  rfb.sendKey(XK_CTRL, 'ControlLeft', false);
  setTimeout(() => finish(''), 700);
}

function reportFieldText(text) {
  try {
    if (window.AndroidVnc && AndroidVnc.onFieldText) AndroidVnc.onFieldText(text);
  } catch (e) { /* page still usable without the app */ }
}

function maybeShowIme(attempt, token) {
  if (token !== imeProbe) return;
  if (textCursorVisible()) {
    readFocusedField(reportFieldText);
    focusIme();
    return;
  }
  if (attempt < 3) {
    setTimeout(() => maybeShowIme(attempt + 1, token), 180);
  } else if (document.activeElement === imeEl) {
    // Tapped something that is not a text field: put the keyboard away and
    // forget the field's text, so the next field starts clean.
    imeEl.blur();
    reportFieldText('');
  }
}

screenEl.addEventListener('touchstart', (e) => {
  if (e.touches.length > 1) {
    multiTouch = true;
    return;
  }
  multiTouch = false;
  tapStart = Date.now();
  tapX = e.touches[0].clientX;
  tapY = e.touches[0].clientY;
}, { passive: true });

screenEl.addEventListener('touchend', (e) => {
  if (e.touches.length > 0) return;
  const wasMulti = multiTouch;
  multiTouch = false;
  if (wasMulti) return;
  const t = e.changedTouches && e.changedTouches[0];
  if (!t) return;
  const moved = Math.abs(t.clientX - tapX) + Math.abs(t.clientY - tapY);
  if (Date.now() - tapStart < 350 && moved < 16) {
    // The click itself has already gone to noVNC; wait for the cursor update
    // that tells us whether it landed on an input.
    const token = ++imeProbe;
    setTimeout(() => maybeShowIme(0, token), 150);
  }
}, { passive: true });

connect();
</script>
</body>
</html>
